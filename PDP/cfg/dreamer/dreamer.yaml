_target_: pdp.workspace.DiffusionPolicyWorkspace

dataset:
    _target_: pdp.dataset.phc_dataset.DiffusionPolicyDatasetPHC
    data_path: /home/mcarroll/Documents/cd-2/VideoMimic/PDP/data/phc_0.5
    horizon: 31 #########################################################################################
    pad_after: 0 # 7
    pad_before: 0 # 1
    cache_data: True

dataloader:
    batch_size: 1024
    num_workers: 8
    persistent_workers: false
    pin_memory: true
    shuffle: true
    drop_last: true

ema:
    _target_: pdp.utils.ema_model.EMAModel
    inv_gamma: 1.0
    max_value: 0.9999
    min_value: 0.0
    power: 0.75
    update_after_step: 0

logging:
    group: null
    id: null
    mode: online
    name: null
    project: pdp
    resume: true

optimizer:
    betas:
        - 0.9
        - 0.95
    lr: 0.0002
    weight_decay: 0.001



training:
    save_checkpoint_every: 5   # epochs
    log_step_freq: 1000
    debug: false
    logging: true
    use_ema: true
    device: cuda:0
    lr_scheduler: cosine
    lr_warmup_steps: 100
    num_epochs: 1000
    rollout_every: 25   # TODO: Maybe implement policy rollouts during training
    seed: 42
    tqdm_interval_sec: 1.0
    val_every: 25       # TODO: Maybe implement val set evaluation during training



policy:
    _target_: pdp.world_model.dreamer_net.DreamerNet
    obs_shape: [357]
    action_size: 69

    rssm_type: 'discrete'
    rssm_info:
        deter_size: 200
        stoch_size: 20
        class_size: 20
        category_size: 20
        min_std: 0.1

    embedding_size: 128
    rssm_node_size: 128
    
    kl_loss_weight: 0.1 
    kl_info:
      use_kl_balance: True
      kl_balance_scale: 0.8
      use_free_nats: False
      free_nats: 0.0

    obs_encoder:
        layers: 3
        node_size: 128
        dist: null
        activation: 'nn.ELU'
  
    obs_decoder:
        layers: 3
        node_size: 128
        dist: 'normal'
        activation: 'nn.ELU'


    T_range: ${dataset.horizon}




