_target_: pdp.workspace.DiffusionPolicyWorkspace

dataset:
    _target_: pdp.dataset.phc_dataset.DiffusionPolicyDatasetPHC
    data_path: /home/mcarroll/Documents/cd-2/VideoMimic/PDP/data/phc_0.5
    horizon: 20 #########################################################################################
    pad_after: 0 # 7
    pad_before: 0 # 1
    cache_data: False

dataloader:
    batch_size: 1024
    num_workers: 8
    persistent_workers: false
    pin_memory: true
    shuffle: true
    drop_last: true

ema:
    _target_: pdp.utils.ema_model.EMAModel
    inv_gamma: 1.0
    max_value: 0.9999
    min_value: 0.0
    power: 0.75
    update_after_step: 0

logging:
    group: null
    id: null
    mode: online
    name: null
    project: pdp
    resume: true

optimizer:
    betas:
        - 0.9
        - 0.95
    lr: 0.0001
    weight_decay: 0.001



training:
    save_checkpoint_every: 5   # epochs
    log_step_freq: 1000
    debug: false
    logging: true
    use_ema: true
    device: cuda:0
    lr_scheduler: cosine
    lr_warmup_steps: 1000
    num_epochs: 1000
    rollout_every: 25   # TODO: Maybe implement policy rollouts during training
    seed: 42
    tqdm_interval_sec: 1.0
    val_every: 25       # TODO: Maybe implement val set evaluation during training
    max_grad_norm: 1.0


policy:
    _target_: pdp.world_model.data2vec.Data2Vec
    sequence_encoder_config:
        state_dim: 357
        action_dim: 69
        hidden_size: 128

    num_layers: 8
    num_heads: 6
    mlp_ratio: 2
    hidden_size: 512
    regressor_size: "sm"

    mask_prob_start: 0.48
    mask_prob_end: 0.48
    mask_prob_anneal_end_step: 0
    mask_noise_std: 0.01

    loss_beta: 0.0
    loss_scale: 1.0

    ema_decay: 0.9999
    ema_end_decay: 0.99999
    ema_anneal_end_step: 100000

    average_top_k_layers: 8
    layer_norm_target_layer: true
    instance_norm_target_layer: false
    batch_norm_target_layer: false
    layer_norm_targets: true
    instance_norm_targets: false


    T_range: ${dataset.horizon}




